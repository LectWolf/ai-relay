services:
  backend:
    image: ghcr.io/lectwolf/ai-relay:latest
    container_name: ai-relay
    ports:
      - "8080:8080"
    environment:
      - TZ=Asia/Shanghai
      - ASPNETCORE_ENVIRONMENT=Production

      # 外部 PostgreSQL / Redis。同机 1Panel 实例用 host.docker.internal
      - ConnectionStrings__Default=Host=host.docker.internal;Port=5432;Database=AiRelay;Username=postgres;Password=YourSecurePassword;GSS Encryption Mode=Disable
      - ConnectionStrings__Redis=host.docker.internal:6379

      - DefaultAdmin__Username=admin
      - DefaultAdmin__Password=Admin@123456
      - DefaultAdmin__Email=admin@ai-relay.com
      - DefaultAdmin__Nickname=系统管理员

      - Jwt__SecretKey=AiRelay-SuperSecretKey-ForProduction-MinimumLength32Characters!
      - Jwt__Issuer=AiRelay
      - Jwt__Audience=AiRelay

      - Cors__AllowAnyLocalhost=false
      - SystemUpdate__Repository=LectWolf/ai-relay
      - SystemUpdate__ImageName=ghcr.io/lectwolf/ai-relay

      - Serilog__MinimumLevel__Default=Information
      - Serilog__MinimumLevel__Override__AiRelay=Information
      - Serilog__MinimumLevel__Override__Microsoft.AspNetCore=Warning
      - Serilog__MinimumLevel__Override__Microsoft.EntityFrameworkCore=Warning

    extra_hosts:
      - "host.docker.internal:host-gateway"

    volumes:
      # 后台「立即更新」在容器里靠 Docker Engine 拉新镜像并重建本容器
      - /var/run/docker.sock:/var/run/docker.sock

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    restart: unless-stopped
