name: Custom Release

on:
  push:
    tags:
      - "custom-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing custom tag to publish (for example custom-v1.13.2.0)"
        required: true
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: custom-release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/lectwolf/ai-relay

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      upstream_version: ${{ steps.version.outputs.upstream_version }}
      node_version: ${{ steps.version.outputs.node_version }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Validate four-part version
        id: version
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#custom-v}"
          if [[ ! "$TAG" =~ ^custom-v[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid custom release tag: $TAG" >&2
            exit 1
          fi

          FILE_VERSION="$(tr -d '\r\n' < VERSION)"
          UPSTREAM_VERSION="$(tr -d '\r\n' < UPSTREAM_VERSION)"
          NODE_VERSION="$(tr -d '[:space:]' < .nvmrc)"
          if [[ "$FILE_VERSION" != "$VERSION" ]]; then
            echo "VERSION ($FILE_VERSION) does not match tag ($VERSION)" >&2
            exit 1
          fi
          if [[ -z "$UPSTREAM_VERSION" ]]; then
            echo "UPSTREAM_VERSION is empty" >&2
            exit 1
          fi
          if [[ -z "$NODE_VERSION" ]]; then
            echo ".nvmrc is empty" >&2
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "upstream_version=$UPSTREAM_VERSION" >> "$GITHUB_OUTPUT"
          echo "node_version=$NODE_VERSION" >> "$GITHUB_OUTPUT"

  build-image:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release source
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.tag }}

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af || true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ needs.validate.outputs.version }}
            ${{ env.IMAGE_NAME }}:custom-latest
            ${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.validate.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          build-args: |
            NODE_VERSION=${{ needs.validate.outputs.node_version }}

  publish-release:
    needs: [validate, build-image]
    runs-on: ubuntu-latest
    steps:
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate.outputs.tag }}
          name: AI-Relay ${{ needs.validate.outputs.version }}
          prerelease: false
          generate_release_notes: true
          body: |
            自定义版本：`${{ needs.validate.outputs.version }}`
            上游 AI-Relay 基线：`${{ needs.validate.outputs.upstream_version }}`

            Docker 镜像：
            ```bash
            docker pull ghcr.io/lectwolf/ai-relay:${{ needs.validate.outputs.version }}
            ```
